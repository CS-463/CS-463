<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img" aria-label="Two feature ovals overlap" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect x="0" y="0" width="760" height="396" fill="#ffffff"/>
<defs><clipPath id="h2"><ellipse cx="290" cy="175" rx="190" ry="60"/></clipPath></defs>
<text x="40" y="34" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="start">With two features, the evidence is where the two ovals overlap</text>
<rect x="40" y="56" width="200" height="272" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<rect x="240" y="56" width="480" height="272" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="140" y="84" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">Defaulters (D)</text>
<text x="140" y="102" font-size="11.5" font-weight="400" fill="#5f5e5a" text-anchor="middle">20 customers</text>
<text x="480" y="84" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">Non-defaulters (Dᶜ)</text>
<text x="480" y="102" font-size="11.5" font-weight="400" fill="#5f5e5a" text-anchor="middle">180 customers</text>
<ellipse cx="330" cy="245" rx="190" ry="60" fill="#2d7dd2" fill-opacity="0.32" clip-path="url(#h2)"/>
<ellipse cx="290" cy="175" rx="190" ry="60" fill="none" stroke="#b4b2a9" stroke-width="1.25" stroke-dasharray="6 4"/>
<ellipse cx="330" cy="245" rx="190" ry="60" fill="none" stroke="#b4b2a9" stroke-width="1.25" stroke-dasharray="2 3"/>
<text x="208" y="215" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">8</text>
<text x="340" y="215" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">9</text>
<text x="330" y="152" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">H: high balance</text>
<text x="360" y="290" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">M: missed a payment</text>
<text x="40" y="354" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Shaded: customers with both M and H. 8 are defaulters and 9 are non-defaulters.</text>
<text x="40" y="374" font-size="11.5" font-weight="400" fill="#5f5e5a" text-anchor="start">Strip widths and oval sizes are not to scale.</text>
