<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-label="Two events A and B in one rectangle" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect x="0" y="0" width="760" height="344" fill="#ffffff"/>
<defs><clipPath id="a"><circle cx="310" cy="180" r="100"/></clipPath></defs>
<text x="40" y="34" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="start">Bayes' theorem starts from one overlap seen two ways</text>
<rect x="40" y="56" width="680" height="264" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="56" y="306" font-size="11.5" font-weight="400" fill="#5f5e5a" text-anchor="start">Everything that could happen (total area = 1)</text>
<circle cx="430" cy="180" r="100" fill="#2d7dd2" fill-opacity="0.22" clip-path="url(#a)"/>
<circle cx="310" cy="180" r="100" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<circle cx="430" cy="180" r="100" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="370" y="184" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">A ∩ B</text>
<text x="255" y="185" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">A</text>
<text x="485" y="185" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">B</text>
</svg>
