<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348" role="img" aria-label="Strips cut the high-balance oval" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect x="0" y="0" width="760" height="348" fill="#ffffff"/>
<defs><clipPath id="h"><ellipse cx="300" cy="200" rx="200" ry="70"/></clipPath></defs>
<text x="40" y="34" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="start">The strips cut the high-balance oval into one piece per class</text>
<rect x="40" y="56" width="200" height="248" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<rect x="240" y="56" width="480" height="248" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="140" y="84" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">Defaulters (D)</text>
<text x="140" y="102" font-size="11.5" font-weight="400" fill="#5f5e5a" text-anchor="middle">20 customers</text>
<text x="480" y="84" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">Non-defaulters (Dᶜ)</text>
<text x="480" y="102" font-size="11.5" font-weight="400" fill="#5f5e5a" text-anchor="middle">180 customers</text>
<rect x="40" y="130" width="200" height="140" fill="#2d7dd2" fill-opacity="0.32" clip-path="url(#h)"/>
<rect x="240" y="130" width="280" height="140" fill="#2d7dd2" fill-opacity="0.16" clip-path="url(#h)"/>
<ellipse cx="300" cy="200" rx="200" ry="70" fill="none" stroke="#b4b2a9" stroke-width="1.25" stroke-dasharray="6 4"/>
<text x="175" y="196" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">D and H</text>
<text x="175" y="214" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="middle">10 customers</text>
<text x="370" y="196" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">Dᶜ and H</text>
<text x="370" y="214" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="middle">45 customers</text>
<text x="522" y="196" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start">H: high balance</text>
<text x="522" y="214" font-size="11.5" font-weight="400" fill="#5f5e5a" text-anchor="start">55 customers in all</text>
<text x="40" y="328" font-size="11.5" font-weight="400" fill="#5f5e5a" text-anchor="start">Strip widths are not to scale: defaulters are really 10% of customers.</text>
</svg>
