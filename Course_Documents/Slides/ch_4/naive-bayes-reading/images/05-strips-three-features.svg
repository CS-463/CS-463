<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Three feature ovals overlap" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<defs>
<clipPath id="h3"><ellipse cx="290" cy="175" rx="190" ry="60"/></clipPath>
<clipPath id="r3"><ellipse cx="215" cy="218" rx="80" ry="100"/></clipPath>
</defs>
<text x="40" y="34" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="start">With three features, the evidence is where all three ovals overlap</text>
<rect x="40" y="56" width="200" height="304" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<rect x="240" y="56" width="480" height="304" rx="8" fill="none" stroke="#b4b2a9" stroke-width="1.25"/>
<text x="140" y="84" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">Defaulters (D)</text>
<text x="140" y="102" font-size="11.5" font-weight="400" fill="#5f5e5a" text-anchor="middle">20 customers</text>
<text x="480" y="84" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">Non-defaulters (D&#7580;)</text>
<text x="480" y="102" font-size="11.5" font-weight="400" fill="#5f5e5a" text-anchor="middle">180 customers</text>
<ellipse cx="330" cy="245" rx="190" ry="60" fill="#2d7dd2" fill-opacity="0.10" clip-path="url(#h3)"/>
<g clip-path="url(#r3)"><ellipse cx="330" cy="245" rx="190" ry="60" fill="#2d7dd2" fill-opacity="0.40" clip-path="url(#h3)"/></g>
<ellipse cx="290" cy="175" rx="190" ry="60" fill="none" stroke="#b4b2a9" stroke-width="1.25" stroke-dasharray="6 4"/>
<ellipse cx="330" cy="245" rx="190" ry="60" fill="none" stroke="#b4b2a9" stroke-width="1.25" stroke-dasharray="2 3"/>
<ellipse cx="215" cy="218" rx="80" ry="100" fill="none" stroke="#5f5e5a" stroke-width="1.25"/>
<text x="400" y="152" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">H: high balance</text>
<text x="380" y="290" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">M: missed a payment</text>
<text x="140" y="342" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="middle">R: renter</text>
<text x="40" y="388" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start">Dark shading: customers with M, H, and R. Light shading: customers with M and H but not R.</text>
<text x="40" y="408" font-size="11.5" font-weight="400" fill="#5f5e5a" text-anchor="start">Strip widths and oval sizes are not to scale.</text>
</svg>
