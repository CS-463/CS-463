# CS 463 conda environment. See README.md for setup steps.
#
# ISLP is installed separately with `pip install --no-deps ISLP`, because its
# declared dependencies pull in PyTorch, which this course doesn't use.
name: CS_463
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas<3
  - scipy
  - matplotlib
  - scikit-learn
  - statsmodels
  - plotly
  - nbformat
  - ipykernel
  - jupyter
  # ISLP's remaining dependencies
  - lxml
  - joblib
  - lifelines
  - pygam
  - pip
